<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>使用统计 - Resume Fit AI</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="admin-page">
    <main class="admin-shell">
      <a class="legal-back" href="/">返回简历优化器</a>
      <header class="admin-header">
        <p class="eyebrow">RESUME FIT AI</p>
        <h1>使用统计</h1>
        <p>完整生成请求的汇总数据</p>
      </header>

      <form class="admin-login" id="statsLoginForm">
        <label for="statsToken">管理员统计令牌</label>
        <div class="admin-login-row">
          <input id="statsToken" type="password" autocomplete="current-password" required />
          <button class="primary" type="submit">查看统计</button>
        </div>
        <p id="statsMessage">令牌仅保存在当前标签页。</p>
      </form>

      <section id="statsDashboard" hidden>
        <div class="admin-stats-grid">
          <article class="admin-stat"><span>近似使用人数</span><strong id="usageUsers">--</strong><small>按浏览器去重</small></article>
          <article class="admin-stat"><span>完整生成次数</span><strong id="usageClicks">--</strong><small>服务器已接受</small></article>
          <article class="admin-stat"><span>今日 AI 请求</span><strong id="dailyAccepted">--</strong><small id="dailyLimit">--</small></article>
          <article class="admin-stat"><span>成功任务</span><strong id="succeededRequests">--</strong><small>本次服务运行期间</small></article>
          <article class="admin-stat"><span>失败任务</span><strong id="failedRequests">--</strong><small>本次服务运行期间</small></article>
          <article class="admin-stat"><span>平均耗时</span><strong id="averageDuration">--</strong><small>成功与失败任务</small></article>
        </div>
        <div class="admin-meta">
          <span>最后完整生成：<strong id="lastGeneratedAt">暂无</strong></span>
          <span>服务运行时间：<strong id="uptime">--</strong></span>
          <button class="secondary compact-button" type="button" id="refreshStatsBtn">刷新</button>
        </div>
      </section>
    </main>
    <script src="/121/admin.js"></script>
  </body>
</html>
