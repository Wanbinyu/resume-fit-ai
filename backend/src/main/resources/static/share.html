<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resume Fit AI · 简历分享</title><style>:root{color-scheme:dark;font-family:Inter,"Microsoft YaHei",sans-serif}body{margin:0;background:#0b1020;color:#eaf0ff}.wrap{width:min(820px,calc(100% - 32px));margin:0 auto;padding:55px 0}.brand{color:#8fa4ff;font-size:12px;letter-spacing:.15em;text-transform:uppercase}.card{margin-top:18px;padding:30px;border:1px solid #293a5c;border-radius:18px;background:#121c31;box-shadow:0 18px 50px #03061366}h1{margin:10px 0 4px;font-size:30px}h2{margin:0;font-size:16px}.muted{color:#92a0bc;font-size:13px}.content{margin-top:24px;padding:22px;border-radius:12px;white-space:pre-wrap;line-height:1.8;color:#dbe3f5;background:#0c1527}.error{color:#ff9eb9}</style></head>
<body><main class="wrap"><div class="brand">RESUME FIT AI · PUBLIC SHARE</div><section id="card" class="card"><div class="muted">正在读取分享版本…</div></section></main><script>const card=document.getElementById('card'),token=new URLSearchParams(location.search).get('token');const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));if(!token){card.innerHTML='<div class="error">分享链接缺少 token</div>'}else{fetch('/api/public/shares/'+encodeURIComponent(token)).then(async r=>{const p=await r.json();if(!r.ok||p.success===false)throw new Error(p.message||'分享链接已失效');return p.data}).then(data=>{card.innerHTML='<div class="muted">公开简历版本 · v'+esc(data.versionNo)+' · '+esc(data.viewCount)+' 次访问</div><h1>'+esc(data.title)+'</h1><div class="content">'+esc(data.content)+'</div>'}).catch(error=>card.innerHTML='<div class="error">'+esc(error.message)+'</div>')}</script></body>
</html>
