<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Fit AI · 服务概览</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0b1020; color: #e8ecf7; }
    .wrap { width: min(1080px, calc(100% - 36px)); margin: 0 auto; padding: 64px 0 48px; }
    .hero { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 34px; }
    .eyebrow { color: #8ea2ff; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; }
    h1 { margin: 10px 0 8px; font-size: clamp(32px, 6vw, 56px); line-height: 1.05; }
    .desc { margin: 0; color: #9ca8c5; font-size: 16px; }
    .status { padding: 10px 14px; border: 1px solid #274a42; border-radius: 999px; color: #62e6b1; background: #10271f; white-space: nowrap; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .card { padding: 20px; border: 1px solid #202b46; border-radius: 18px; background: linear-gradient(145deg, #131b31, #101729); box-shadow: 0 16px 40px #05081444; }
    .label { color: #91a0bd; font-size: 13px; }
    .value { margin-top: 12px; font-size: 30px; font-weight: 700; }
    .accent { color: #8ea2ff; }
    .wide { grid-column: span 2; }
    .footer { display: flex; gap: 20px; margin-top: 30px; color: #8d98b2; font-size: 13px; }
    a { color: #aab8ff; text-decoration: none; }
    @media (max-width: 760px) { .hero { display: block; } .status { display: inline-block; margin-top: 20px; } .grid { grid-template-columns: repeat(2, 1fr); } .wide { grid-column: span 2; } }
    @media (max-width: 430px) { .grid { grid-template-columns: 1fr; } .wide { grid-column: span 1; } }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div>
        <div class="eyebrow">Resume Fit AI · Backend</div>
        <h1>简历与 JD 的<br><span class="accent">智能匹配中枢</span></h1>
        <p class="desc">Spring Boot · Spring AI · Java Agent Workflow</p>
      </div>
      <div id="status" class="status">正在读取服务状态…</div>
    </section>
    <section class="grid" aria-label="服务使用数据">
      <div class="card"><div class="label">注册用户</div><div id="totalUsers" class="value">—</div></div>
      <div class="card"><div class="label">简历数量</div><div id="totalResumes" class="value">—</div></div>
      <div class="card"><div class="label">JD 数量</div><div id="totalJobs" class="value">—</div></div>
      <div class="card"><div class="label">分析任务</div><div id="totalAnalysisTasks" class="value">—</div></div>
      <div class="card wide"><div class="label">AI 分析成功率</div><div id="analysisSuccessRate" class="value accent">—</div></div>
      <div class="card"><div class="label">简历总访问</div><div id="totalResumeViews" class="value">—</div></div>
      <div class="card"><div class="label">今日访问</div><div id="todayResumeViews" class="value">—</div></div>
      <div class="card"><div class="label">AI 调用次数</div><div id="aiCalls" class="value">—</div></div>
      <div class="card"><div class="label">估算 Token</div><div id="estimatedTokens" class="value">—</div></div>
    </section>
    <footer class="footer"><span>数据每次打开页面时刷新</span><a href="/swagger-ui.html">打开 API 文档 →</a><a href="/admin.html">进入管理后台 →</a><a href="/workspace.html">简历版本工作台 →</a></footer>
  </main>
  <script>
    const fields = ['totalUsers', 'totalResumes', 'totalJobs', 'totalAnalysisTasks', 'totalResumeViews', 'todayResumeViews'];
    fetch('/api/public/overview')
      .then(response => response.json())
      .then(({ data }) => {
        fields.forEach(field => document.getElementById(field).textContent = data[field].toLocaleString('zh-CN'));
        document.getElementById('analysisSuccessRate').textContent = data.analysisSuccessRate + '%';
        document.getElementById('aiCalls').textContent = data.aiUsage.totalCalls.toLocaleString('zh-CN');
        document.getElementById('estimatedTokens').textContent = (data.aiUsage.estimatedInputTokens + data.aiUsage.estimatedOutputTokens).toLocaleString('zh-CN');
        document.getElementById('status').textContent = data.status === 'UP' ? '● 服务运行正常 · ' + data.aiMode : '服务异常';
      })
      .catch(() => document.getElementById('status').textContent = '无法连接服务');
  </script>
</body>
</html>
