<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Resume Fit AI · 简历版本工作台</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Microsoft YaHei",sans-serif;--bg:#09101f;--panel:#121d32;--panel2:#17253e;--line:#2a3a5b;--muted:#91a0bd;--text:#eef3ff;--blue:#a7b5ff;--cyan:#63e4c0;--pink:#ff9db9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 88% 0,#263560 0,#09101f 40%);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{width:min(1280px,calc(100% - 34px));margin:auto;padding:31px 0 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:25px}.brand{display:flex;align-items:center;gap:11px;font-weight:750}.mark{display:grid;place-items:center;width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#0b1323;font-size:12px}.eyebrow{margin-top:23px;color:var(--cyan);font-size:11px;letter-spacing:.15em;text-transform:uppercase}h1{margin:6px 0;font-size:32px;letter-spacing:-.03em}.sub{margin:0;color:var(--muted);font-size:14px}.top-actions{display:flex;gap:9px}.btn{border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:#dce5ff;background:#18253e}.btn:hover{border-color:#6577a8}.btn.primary{border:0;color:#091424;background:linear-gradient(135deg,var(--cyan),var(--blue));font-weight:700}.layout{display:grid;grid-template-columns:285px 1fr;gap:16px}.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#142039,#10192c);box-shadow:0 17px 45px #02061755}.card-head{display:flex;align-items:center;justify-content:space-between;padding:17px 19px;border-bottom:1px solid var(--line)}h2{margin:0;font-size:16px}.hint{color:var(--muted);font-size:12px}.body{padding:18px 19px}.side-card{height:max-content}.select, input, textarea{width:100%;border:1px solid #30415f;border-radius:9px;outline:0;color:var(--text);background:#0c1527}.select,input{padding:11px}textarea{min-height:250px;padding:13px;line-height:1.7;resize:vertical}.select:focus,input:focus,textarea:focus{border-color:var(--blue)}label{display:block;color:#aebbd5;font-size:12px;margin:12px 0 6px}.resume-list{display:grid;gap:7px;margin-top:12px}.resume-item{padding:11px 12px;border:1px solid transparent;border-radius:10px;color:#b8c5df;background:#14213a;text-align:left}.resume-item.active,.resume-item:hover{border-color:#53699c;background:#1d2b4b}.resume-item small{display:block;margin-top:4px;color:var(--muted);font-size:11px}.divider{height:1px;background:#253653;margin:19px 0}.full{width:100%}.stack{display:grid;gap:10px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}.toolbar .select{width:auto;min-width:145px}.versions{display:grid;gap:10px}.version{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:15px;border:1px solid #2a3a5b;border-radius:12px;background:#14213a}.version:hover{border-color:#6579ae}.version-title{font-weight:650}.version-meta{margin-top:7px;color:var(--muted);font-size:11px}.version-meta span{margin-right:12px}.version-actions{display:flex;gap:7px}.mini{padding:7px 10px;border-radius:8px;border:1px solid var(--line);color:#c9d4ef;background:#1b2945;font-size:12px}.mini:hover{border-color:var(--blue)}.published{color:var(--cyan);font-size:11px}.editor{margin-top:16px}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.analysis{margin-top:16px}.analysis-actions{display:flex;flex-wrap:wrap;gap:9px}.analysis-result{display:none;margin-top:14px;padding:15px;border-radius:11px;background:#101b31}.analysis-result.show{display:block}.score{color:var(--cyan);font-size:38px;font-weight:800}.summary{margin:7px 0 14px;color:#ced8ec;line-height:1.65}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:5px 9px;border-radius:7px;color:#c4ceff;background:#25345b;font-size:12px}.chip.missing{color:#ffc0cb;background:#4b273c}.trace{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}.trace-item{padding:10px;border:1px solid #2a3b59;border-radius:9px;background:#172640}.trace-item b{display:block;color:var(--cyan);font-size:11px}.trace-item span{display:block;margin-top:5px;color:#d4ddf2;font-size:11px;line-height:1.45}.compare{margin-top:16px}.compare-result{margin-top:12px;color:#cbd6ec;line-height:1.7}.reports{margin-top:16px}.report-item{padding:11px 0;border-bottom:1px solid #253653;font-size:12px}.report-item:last-child{border-bottom:0}.alert{min-height:19px;margin:8px 0;color:var(--pink);font-size:12px}.login{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:#080e1aec;backdrop-filter:blur(10px)}.login.hidden{display:none}.login-box{width:min(410px,100%);padding:30px;border:1px solid #324666;border-radius:20px;background:#121d32;box-shadow:0 25px 70px #020617aa}.login-box h2{margin:26px 0 6px;font-size:23px}.login-box p{margin:0 0 20px;color:var(--muted);font-size:13px}.login-error{min-height:19px;color:var(--pink);font-size:12px}.register-only{display:none}.login.register-mode .register-only{display:block}@media(max-width:900px){.layout{grid-template-columns:1fr}.editor-grid{grid-template-columns:1fr}.trace{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.wrap{width:min(100% - 22px,1280px);padding-top:20px}.top{display:block}.top-actions{margin-top:15px}.version{display:block}.version-actions{margin-top:12px}.trace{grid-template-columns:1fr 1fr}}
  </style>
</head>
  <body>
  <div id="login" class="login"><form id="loginForm" class="login-box"><div class="brand"><span class="mark">RF</span><span>Resume Fit AI</span></div><h2 id="authTitle">简历版本工作台</h2><p id="authHint">登录后管理原始版、岗位定制版和公开分享版本。</p><label class="register-only">显示名称<input id="displayName" autocomplete="name" placeholder="例如：张三"></label><label>用户名<input id="username" required autocomplete="username" placeholder="请输入用户名"></label><label>密码<input id="password" required type="password" autocomplete="current-password" placeholder="至少 8 位字符"></label><div id="loginError" class="login-error"></div><button id="authSubmit" class="btn primary full" type="submit">登录工作台</button><button id="authToggle" class="btn full" type="button" style="margin-top:9px">首次使用？注册账号</button></form></div>
  <main class="wrap">
    <header class="top"><div><div class="brand"><span class="mark">RF</span><span>Resume Fit AI</span></div><div class="eyebrow">Version Workspace</div><h1>简历版本工作台</h1><p class="sub">让每一次岗位分析都沉淀成可编辑、可对比、可分享的简历版本。</p></div><div class="top-actions"><button id="refreshBtn" class="btn">↻ 刷新</button><button id="logoutBtn" class="btn">退出登录</button></div></header>
    <div class="layout">
      <aside class="card side-card"><div class="card-head"><h2>我的简历</h2><span id="resumeCount" class="hint">0</span></div><div class="body"><div id="resumeList" class="resume-list"><div class="hint">正在读取…</div></div><div class="divider"></div><h2 style="font-size:14px">新增简历</h2><label>标题<input id="newResumeTitle" placeholder="例如：Java 后端简历"></label><label>简历内容<textarea id="newResumeContent" style="min-height:110px" placeholder="粘贴简历内容"></textarea></label><div id="resumeError" class="alert"></div><button id="createResumeBtn" class="btn primary full">保存简历</button><div class="divider"></div><h2 style="font-size:14px">新增目标 JD</h2><label>岗位标题<input id="newJobTitle" placeholder="例如：Java 后端工程师"></label><label>JD 内容<textarea id="newJobContent" style="min-height:90px" placeholder="粘贴岗位描述"></textarea></label><div id="jobError" class="alert"></div><button id="createJobBtn" class="btn full">保存 JD</button></div></aside>
      <section>
        <article class="card"><div class="card-head"><h2>版本时间线</h2><span id="versionHint" class="hint">请先选择简历</span></div><div class="body"><div id="versions" class="versions"><div class="empty hint">选择左侧简历后查看版本</div></div></div></article>
        <article class="card editor"><div class="card-head"><h2 id="editorTitle">新建简历版本</h2><span class="hint">内容最多 6000 字符</span></div><div class="body"><div class="editor-grid"><div><label>版本名称<input id="versionName" maxlength="160" placeholder="例如：Java 后端岗位定制版"></label><label>目标 JD<select id="jobSelect" class="select"><option value="">不绑定目标 JD</option></select></label><label>关联分析任务<input id="taskId" type="number" min="1" placeholder="运行分析后自动填充"></label></div><div><label>版本来源<select id="versionSource" class="select"><option value="MANUAL">手动编辑</option><option value="AI_OPTIMIZED">AI 优化</option><option value="JOB_TARGETED">岗位定制</option></select></label><label>版本内容<textarea id="versionContent" maxlength="6000" placeholder="编辑此版本的简历内容"></textarea></label></div></div><div id="versionError" class="alert"></div><div class="analysis-actions"><button id="newVersionBtn" class="btn">清空新建</button><button id="saveVersionBtn" class="btn primary">保存版本</button></div></div></article>
        <article class="card analysis"><div class="card-head"><h2>JD 定向分析</h2><span class="hint">Demo Agent · 离线运行</span></div><div class="body"><div class="toolbar"><select id="analysisJobSelect" class="select"><option value="">选择目标 JD</option></select><button id="analyzeBtn" class="btn primary">运行 Agent 分析</button></div><div id="analysisError" class="alert"></div><div id="analysisResult" class="analysis-result"></div></div></article>
        <article class="card compare"><div class="card-head"><h2>版本对比</h2><span class="hint">按非空行统计变化</span></div><div class="body"><div class="toolbar"><select id="fromVersion" class="select"><option value="">基准版本</option></select><span class="hint">→</span><select id="toVersion" class="select"><option value="">目标版本</option></select><button id="compareBtn" class="btn">开始对比</button></div><div id="compareResult" class="compare-result"></div></div></article>
        <article class="card reports"><div class="card-head"><h2>历史分析报告</h2><span id="reportHint" class="hint">—</span></div><div id="reports" class="body"><div class="hint">暂无报告</div></div></article>
      </section>
    </div>
  </main>
  <script>
    const state={token:localStorage.getItem('resume-fit-user-token')||'',resumes:[],jobs:[],versions:[],editingId:null,authMode:'login'};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const num=v=>Number(v||0).toLocaleString('zh-CN');
    async function request(url,options={}){const response=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{}),...(state.token?{Authorization:'Bearer '+state.token}:{})}});if(response.status===401||response.status===403){logout(false);throw new Error('登录已失效或没有访问权限');}const payload=await response.json();if(!response.ok||payload.success===false)throw new Error(payload.message||'请求失败');return payload.data}
    function logout(clear=true){state.token='';localStorage.removeItem('resume-fit-user-token');$('login').classList.remove('hidden');if(clear)$('loginError').textContent=''}
    function setAuthMode(mode){state.authMode=mode;$('login').classList.toggle('register-mode',mode==='register');$('authTitle').textContent=mode==='register'?'创建工作台账号':'简历版本工作台';$('authHint').textContent=mode==='register'?'注册后即可保存简历版本、分析报告和分享链接。':'登录后管理原始版、岗位定制版和公开分享版本。';$('authSubmit').textContent=mode==='register'?'注册并进入工作台':'登录工作台';$('authToggle').textContent=mode==='register'?'已有账号？返回登录':'首次使用？注册账号';$('loginError').textContent=''}
    $('authToggle').onclick=()=>setAuthMode(state.authMode==='login'?'register':'login');$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent=state.authMode==='register'?'注册中…':'登录中…';try{const body={username:$('username').value.trim(),password:$('password').value};if(state.authMode==='register')body.displayName=$('displayName').value.trim();const data=await request(state.authMode==='register'?'/api/auth/register':'/api/auth/login',{method:'POST',body:JSON.stringify(body)});state.token=data.token;localStorage.setItem('resume-fit-user-token',state.token);$('login').classList.add('hidden');await loadBase()}catch(error){$('loginError').textContent=error.message}});$('logoutBtn').onclick=()=>logout();$('refreshBtn').onclick=loadBase;
    async function loadBase(){try{const [resumes,jobs]=await Promise.all([request('/api/resumes'),request('/api/jobs')]);state.resumes=resumes||[];state.jobs=jobs||[];renderBase();if(state.resumes.length){if(!state.selectedResumeId||!state.resumes.some(x=>x.id===state.selectedResumeId))state.selectedResumeId=state.resumes[0].id;await loadResume()}else{state.versions=[];renderVersions()}}catch(error){if(state.token)alert(error.message)}}
    function renderBase(){$('resumeCount').textContent=state.resumes.length+' 份';$('resumeList').innerHTML=state.resumes.length?state.resumes.map(item=>`<button class="resume-item ${item.id===state.selectedResumeId?'active':''}" onclick="selectResume(${item.id})">${esc(item.title)}<small>${esc(item.sourceFileName||'手动创建')}</small></button>`).join(''):'<div class="hint">还没有简历</div>';const options='<option value="">不绑定目标 JD</option>'+state.jobs.map(job=>`<option value="${job.id}">${esc(job.title)}</option>`).join('');$('jobSelect').innerHTML=options;$('analysisJobSelect').innerHTML='<option value="">选择目标 JD</option>'+state.jobs.map(job=>`<option value="${job.id}">${esc(job.title)}</option>`).join('')}
    window.selectResume=async id=>{state.selectedResumeId=id;renderBase();await loadResume()};async function loadResume(){if(!state.selectedResumeId)return;try{const [versions,reports]=await Promise.all([request(`/api/resumes/${state.selectedResumeId}/versions`),request(`/api/resumes/${state.selectedResumeId}/reports`)]);state.versions=versions||[];state.reports=reports||[];renderVersions();renderReports()}catch(error){alert(error.message)}}
    function renderVersions(){ $('versionHint').textContent=state.versions.length?`${state.versions.length} 个版本`:'暂无版本';$('versions').innerHTML=state.versions.length?state.versions.map(v=>`<div class="version"><div><div class="version-title">v${v.versionNo} · ${esc(v.title)}</div><div class="version-meta"><span>${esc(v.source)}</span><span>${num(v.viewCount)} 次访问</span><span>${new Date(v.createdAt).toLocaleString('zh-CN',{hour12:false})}</span>${v.published?'<span class="published">● 已发布</span>':''}</div></div><div class="version-actions"><button class="mini" onclick="editVersion(${v.id})">编辑</button><button class="mini" onclick="publishVersion(${v.id},${v.published})">${v.published?'取消发布':'发布'}</button></div></div>`).join(''):'<div class="empty hint">暂无版本，请从右侧新建</div>';const opts='<option value="">基准版本</option>'+state.versions.map(v=>`<option value="${v.id}">v${v.versionNo} · ${esc(v.title)}</option>`).join('');$('fromVersion').innerHTML=opts;$('toVersion').innerHTML=opts}
    function renderReports(){const reports=state.reports||[];$('reportHint').textContent=reports.length?`${reports.length} 份报告`:'暂无报告';$('reports').innerHTML=reports.length?reports.map(r=>`<div class="report-item"><strong>任务 #${r.taskId} · ${r.score} 分</strong><span class="hint">　${new Date(r.createdAt).toLocaleString('zh-CN',{hour12:false})}</span><div style="margin-top:5px;color:#aebbd5">${esc(r.report?.summary||'无摘要')}</div></div>`).join(''):'<div class="hint">暂无分析报告，先运行一次 Agent 分析</div>'}
    window.editVersion=id=>{const v=state.versions.find(x=>x.id===id);if(!v)return;state.editingId=id;$('editorTitle').textContent=`编辑 v${v.versionNo}`;$('versionName').value=v.title;$('versionContent').value=v.content;$('versionSource').value=v.source||'MANUAL';$('jobSelect').value=v.targetJobId||'';$('taskId').value=v.analysisTaskId||'';window.scrollTo({top:document.querySelector('.editor').offsetTop-15,behavior:'smooth'})};
    window.publishVersion=async(id,published)=>{try{const data=await request(`/api/resumes/${state.selectedResumeId}/versions/${id}/publish`,{method:published?'DELETE':'POST'});if(!published){const url=location.origin+'/share.html?token='+data.sharePath.split('/').pop();await navigator.clipboard?.writeText(url);alert('已发布，分享链接已复制：\n'+url)}await loadResume()}catch(error){alert(error.message)}};
    $('newVersionBtn').onclick=()=>{state.editingId=null;$('editorTitle').textContent='新建简历版本';$('versionName').value='';$('versionContent').value='';$('versionSource').value='MANUAL';$('jobSelect').value='';$('taskId').value='';$('versionError').textContent=''};
    $('saveVersionBtn').onclick=async()=>{if(!state.selectedResumeId)return $('versionError').textContent='请先选择简历';const body={title:$('versionName').value.trim(),content:$('versionContent').value.trim()};if(!body.title||!body.content)return $('versionError').textContent='版本名称和内容不能为空';body.source=$('versionSource').value;body.targetJobId=$('jobSelect').value?Number($('jobSelect').value):null;body.analysisTaskId=$('taskId').value?Number($('taskId').value):null;try{await request(state.editingId?`/api/resumes/${state.selectedResumeId}/versions/${state.editingId}`:`/api/resumes/${state.selectedResumeId}/versions`,{method:state.editingId?'PUT':'POST',body:JSON.stringify(body)});$('versionError').textContent='保存成功';$('newVersionBtn').click();await loadResume()}catch(error){$('versionError').textContent=error.message}};
    $('createResumeBtn').onclick=async()=>{const title=$('newResumeTitle').value.trim(),content=$('newResumeContent').value.trim();if(!title||!content)return $('resumeError').textContent='标题和内容不能为空';try{const data=await request('/api/resumes',{method:'POST',body:JSON.stringify({title,content,sourceFileName:'workspace.txt'})});$('newResumeTitle').value='';$('newResumeContent').value='';$('resumeError').textContent='保存成功';state.selectedResumeId=data.id;await loadBase()}catch(error){$('resumeError').textContent=error.message}};
    $('createJobBtn').onclick=async()=>{const title=$('newJobTitle').value.trim(),content=$('newJobContent').value.trim();if(!title||!content)return $('jobError').textContent='岗位标题和 JD 内容不能为空';try{await request('/api/jobs',{method:'POST',body:JSON.stringify({title,content})});$('newJobTitle').value='';$('newJobContent').value='';$('jobError').textContent='保存成功';await loadBase()}catch(error){$('jobError').textContent=error.message}};
    $('analyzeBtn').onclick=async()=>{const jobId=Number($('analysisJobSelect').value);if(!state.selectedResumeId||!jobId)return $('analysisError').textContent='请先选择简历和目标 JD';$('analysisError').textContent='Agent 正在执行…';try{const task=await request('/api/analysis/tasks',{method:'POST',body:JSON.stringify({resumeId:state.selectedResumeId,jobId})});let current;for(let i=0;i<30;i++){await new Promise(r=>setTimeout(r,250));current=await request(`/api/analysis/tasks/${task.id}`);if(['SUCCEEDED','FAILED','CANCELLED'].includes(current.status))break}if(current.status!=='SUCCEEDED')throw new Error(current.errorMessage||'分析未成功完成');$('taskId').value=current.id;renderAnalysis(current.result);$('analysisError').textContent='分析完成，可编辑内容后保存为新版本';await loadResume()}catch(error){$('analysisError').textContent=error.message}};
    function renderAnalysis(result){const matching=result.matching||{};const trace=result.agentTrace||[];$('analysisResult').classList.add('show');$('analysisResult').innerHTML=`<div class="score">${result.score??'—'}<span style="font-size:15px;color:var(--muted)"> / 100</span></div><div class="summary">${esc(result.summary||'暂无总结')}</div><div class="hint">关键词覆盖率：${matching.coverage??0}%</div><div class="chips" style="margin-top:8px">${(matching.matchedKeywords||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}${(matching.missingKeywords||[]).map(x=>`<span class="chip missing">缺：${esc(x)}</span>`).join('')}</div><div class="trace">${trace.map((x,i)=>`<div class="trace-item"><b>STEP 0${i+1}</b><span>${esc(x.name)}</span><span style="color:var(--muted)">${esc(x.message)}</span></div>`).join('')}</div>`}
    $('compareBtn').onclick=async()=>{const from=$('fromVersion').value,to=$('toVersion').value;if(!from||!to)return $('compareResult').textContent='请选择两个版本';try{const data=await request(`/api/resumes/${state.selectedResumeId}/versions/compare?from=${from}&to=${to}`);$('compareResult').innerHTML=`从 <strong>v${data.from.versionNo}</strong> 到 <strong>v${data.to.versionNo}</strong>：共变化 <strong style="color:var(--cyan)">${data.changedLines}</strong> 行，新增 ${data.addedLines} 行，删除 ${data.removedLines} 行。`}catch(error){$('compareResult').textContent=error.message}};
    $('login').classList.toggle('hidden',Boolean(state.token));if(state.token)loadBase();
  </script>
</body>
</html>
